<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background:#f5f7fb; display:flex; justify-content:center; align-items:center; height:100vh; }
        .box { background:white; padding:40px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1); width:400px; }
        h2 { margin-bottom:20px; color:#0f172a; text-align:center; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #cbd5e1; border-radius:8px; }
        .btn { width:100%; padding:12px; background:#0f172a; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Login</h2>
        <form action="AdminLoginServlet" method="post">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="text-align:center; margin-top:15px;">New Admin? <a href="admin-register.html">Register here</a></p>
    </div>
</body>
</html>

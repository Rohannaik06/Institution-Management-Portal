<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admission Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
}

/* Header */

header{
height:70px;
background:#0f172a;
color:white;
display:flex;
align-items:center;
padding:0 30px;
}

.logo{
font-size:22px;
font-weight:600;
}

/* Container */

.container{
max-width:900px;
margin:40px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.container h2{
margin-bottom:25px;
color:#0f172a;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:500;
color:#334155;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#2563eb;
}

textarea{
height:100px;
resize:none;
}

.full-width{
grid-column:1/3;
}

.checkbox{
display:flex;
align-items:flex-start;
gap:10px;
margin-top:10px;
}

.checkbox input{
width:auto;
margin-top:5px;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
font-weight:500;
}

.btn:hover{
background:#1d4ed8;
}

.required{
color:red;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.full-width{
grid-column:auto;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Institution Portal
</div>

</header>

<div class="container">

<h2>Admission Application Form</h2>

<form action="AdmissionServlet" method="post">

<div class="form-grid">

<div class="form-group">
<label>Full Name <span class="required">*</span></label>
<input
type="text"
name="fullName"
required
pattern="[A-Za-z ]{3,50}">
</div>

<div class="form-group">
<label>Mobile Number <span class="required">*</span></label>
<input
type="tel"
name="mobile"
required
maxlength="10"
pattern="[0-9]{10}">
</div>

<div class="form-group">
<label>Email ID <span class="required">*</span></label>
<input
type="email"
name="email"
required>
</div>

<div class="form-group">
<label>Gender <span class="required">*</span></label>

<select name="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="form-group">

<label>Stream <span class="required">*</span></label>

<select
id="stream"
name="stream"
required
onchange="loadCourses()">

<option value="">Select Stream</option>

<option value="engineering">
Engineering
</option>

<option value="diploma">
Diploma
</option>

<option value="management">
Management
</option>

<option value="computer">
Computer Applications
</option>

</select>

</div>

<div class="form-group">

<label>Course <span class="required">*</span></label>

<select
id="course"
name="course"
required>

<option value="">
Select Course
</option>

</select>

</div>

<div class="form-group full-width">

<label>Address <span class="required">*</span></label>

<textarea
name="address"
required></textarea>

</div>

<div class="form-group full-width">

<div class="checkbox">

<input
type="checkbox"
required>

<label>

I hereby declare that the information provided by me is true and correct.

</label>

</div>

</div>

</div>

<button type="submit" class="btn">

Submit Application

</button>

</form>

</div>

<script>

function loadCourses(){

let stream =
document.getElementById("stream").value;

let course =
document.getElementById("course");

course.innerHTML =
'<option value="">Select Course</option>';

let courses=[];

if(stream==="engineering"){

courses=[

"B.Tech Information Technology",

"B.Tech Computer Science",

"B.Tech Mechanical Engineering",

"B.Tech Civil Engineering"

];

}

else if(stream==="diploma"){

courses=[

"Diploma Computer Engineering",

"Diploma Mechanical Engineering",

"Diploma Civil Engineering",

"Diploma Electrical Engineering"

];

}

else if(stream==="management"){

courses=[

"BBA",

"MBA"

];

}

else if(stream==="computer"){

courses=[

"BCA",

"MCA"

];

}

courses.forEach(function(item){

let option =
document.createElement("option");

option.text=item;

option.value=item;

course.add(option);

});

}

</script>

</body>
</html>

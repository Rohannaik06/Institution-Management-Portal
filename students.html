<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f5f7fb; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #08142f; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .btn { padding: 8px 12px; border-radius: 5px; text-decoration: none; color: white; font-size: 13px; }
        .view { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>All Students (Admissions)</h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr>
            </thead>
            <tbody id="studentTableBody">
                </tbody>
        </table>
    </div>

    <script>
        // पेज लोड होताच डेटा आणा
        window.onload = function() {
            fetch('GetAllStudentsServlet')
            .then(res => {
                if (!res.ok) throw new Error("Server error");
                return res.text();
            })
            .then(data => {
                document.getElementById("studentTableBody").innerHTML = data;
            })
            .catch(err => {
                document.getElementById("studentTableBody").innerHTML = "<tr><td colspan='5'>Error loading data. Check console.</td></tr>";
                console.error(err);
            });
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Courses | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f5f7fb; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .add-btn { background: #2563eb; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #08142f; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .btn { padding: 6px 12px; border-radius: 5px; text-decoration: none; color: white; font-size: 12px; }
        .edit { background: #f59e0b; }
        .delete { background: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Course Management</h2>
            <a href="#" class="add-btn">+ Add New Course</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Duration</th>
                    <th>Fees</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>CS101</td>
                    <td>B.Tech Computer Science</td>
                    <td>4 Years</td>
                    <td>₹1,50,000</td>
                    <td>
                        <a href="#" class="btn edit">Edit</a>
                        <a href="#" class="btn delete">Delete</a>
                    </td>
                </tr>
                <tr>
                    <td>IT202</td>
                    <td>B.Sc Information Technology</td>
                    <td>3 Years</td>
                    <td>₹80,000</td>
                    <td>
                        <a href="#" class="btn edit">Edit</a>
                        <a href="#" class="btn delete">Delete</a>
                    </td>
                </tr>
                <tr>
                    <td>MBA303</td>
                    <td>Master of Business Admin</td>
                    <td>2 Years</td>
                    <td>₹2,00,000</td>
                    <td>
                        <a href="#" class="btn edit">Edit</a>
                        <a href="#" class="btn delete">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admission Fee Payment</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7fc; padding: 40px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .info-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .info-box label { display: block; font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .info-box p { font-size: 16px; font-weight: 600; }
        .btn { background: #2563eb; color: white; padding: 18px; border: none; width: 100%; border-radius: 10px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admission Fee Payment</h2>
        <div class="info-grid">
            <div class="info-box"><label>Application ID</label><p>APP2026001</p></div>
            <div class="info-box"><label>Student Name</label><p>Rohan Naik</p></div>
            <div class="info-box"><label>Selected Course</label><p>B.Tech Information Technology</p></div>
            <div class="info-box"><label>Academic Session</label><p>2026 - 2030</p></div>
        </div>
        
        <form action="PaymentServlet" method="post">
            <input type="hidden" name="amount" value="120000">
            <select name="paymentMethod" style="width:100%; padding:15px; margin-bottom:20px;">
                <option value="UPI">UPI</option>
                <option value="Debit Card">Debit Card</option>
            </select>
            <button type="submit" class="btn">Pay Now ₹ 1,20,000</button>
        </form>
    </div>
</body>
</html>
